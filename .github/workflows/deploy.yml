name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Docker App to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          timeout: 180s
          command_timeout: 20m
          script: |
            set -e

            # Target directory on VPS
            APP_DIR="/var/www/thenisai"
            echo "==> Deploying Thenisai to ${APP_DIR}..."

            # Create directory if it doesn't exist
            mkdir -p "${APP_DIR}"
            cd "${APP_DIR}"

            # Clone or pull latest code from main
            if [ -d ".git" ]; then
              echo "==> Fetching latest changes..."
              git fetch origin main
              git reset --hard origin/main
            else
              echo "==> Cloning repository..."
              git clone https://github.com/risewithmediaofficial-collab/thenisai.git .
            fi

            # Prepare build version metadata
            COMMIT_SHA="${{ github.sha }}"
            BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "==> Building fresh frontend image with commit ${COMMIT_SHA:0:7}..."

            # Build ONLY the frontend image with no-cache and commit build-args
            docker compose build --no-cache \
              --build-arg BUILD_COMMIT="${COMMIT_SHA}" \
              --build-arg BUILD_TIME="${BUILD_DATE}" \
              thenisai

            # Recreate ONLY the frontend container — preserving backend, MongoDB and all data
            echo "==> Recreating frontend container..."
            docker compose up -d --no-deps --force-recreate thenisai

            # Safely prune dangling build cache layers without touching running containers
            echo "==> Pruning dangling image layers..."
            docker image prune -f || true

            # Health Check: verify port 92 responds with HTTP 200
            echo "==> Running post-deployment health check on http://127.0.0.1:92..."
            HEALTHY=false
            for i in $(seq 1 15); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:92/ || true)
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "==> Health check passed! Frontend container returned HTTP 200."
                HEALTHY=true
                break
              fi
              echo "Waiting for frontend container on port 92... (attempt $i/15)"
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: Frontend container health check failed on port 92!"
              exit 1
            fi

            # Confirm deployed version
            echo "==> Deployed Version Endpoint:"
            curl -s http://127.0.0.1:92/version.json || echo "version.json unavailable"

            echo "==> Deployment completed successfully! App running on port 92."
