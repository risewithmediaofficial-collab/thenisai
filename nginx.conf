server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/html
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        font/woff;
    gzip_static on;
    # Also serve pre-compressed .br (brotli) files when client supports it
    # Requires nginx built with ngx_brotli module (available in nginx-extras / bitnami images)
    # brotli_static on;

    # Proxy all /api requests to the Express backend container
    location /api {
        proxy_pass         http://backend:5003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Disable caching for all API requests
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # index.html — never cache so browsers always get latest deploy
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri /index.html;
    }

    # SPA fallback — serve index.html for all non-asset routes (never cache HTML)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Favicons & Manifest — short cache so search engines and browsers revalidate quickly
    location ~* (favicon|apple-touch-icon|logo-icon|site\.webmanifest) {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # ── Static product/branding images (/images/) ─────────────────────────────
    # These are NOT content-hashed filenames — never use "immutable" here.
    # Short 1-hour TTL so Cloudflare CDN and browsers re-fetch quickly after
    # any deploy. "must-revalidate" ensures stale content is never served.
    location ~* ^/images/.*\.(png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Vary "Accept-Encoding";
    }

    # ── Vite-built JS/CSS/fonts — content-hashed filenames, safe to cache forever ──
    # Vite generates filenames like /assets/chunk-BxZ7a1Kp.js — hash changes on
    # every build so "immutable" is correct here: no need to ever revalidate.
    location ~* ^/assets/.*\.(js|css|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin" always;
}
