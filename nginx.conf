server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Dynamic Gzip Compression ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/html
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        font/woff;

    # ── Proxy all /api requests to Express backend ───────────────────────────
    location /api {
        proxy_pass         http://backend:5003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Disable caching for all API requests
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header Referrer-Policy        "strict-origin" always;
    }

    # ── Application entry point: index.html ──────────────────────────────────
    # CRITICAL: index.html must NEVER be cached by browsers or intermediate caches.
    # When a new Vite bundle is deployed, users must receive the new HTML immediately.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header Referrer-Policy        "strict-origin" always;
        try_files $uri =404;
    }

    # ── Service Worker & Version Metadata ─────────────────────────────────────
    # Must never be cached so service worker and version checks are always live.
    location ~* ^/(sw\.js|version\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header Referrer-Policy        "strict-origin" always;
        try_files $uri =404;
    }

    # ── Vite Hashed Assets (/assets/) ─────────────────────────────────────────
    # Filenames are content-hashed (e.g. index-Bi09CABA.js, index-B0zQRHEs.css).
    # Safe to cache forever with "immutable". If code changes, Vite produces a
    # new hash and index.html points to the new file.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header Referrer-Policy        "strict-origin" always;
        try_files $uri =404;
    }

    # ── Static Images & Branding (/images/) ───────────────────────────────────
    # Non-hashed static files. We do NOT use "immutable" here.
    # Short TTL (1 hour) with must-revalidate ensures browsers and Cloudflare revalidate.
    location ^~ /images/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header Vary "Accept-Encoding";
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header Referrer-Policy        "strict-origin" always;
        try_files $uri =404;
    }

    # ── Favicons & Web Manifest ───────────────────────────────────────────────
    location ~* \.(ico|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header Referrer-Policy        "strict-origin" always;
        try_files $uri =404;
    }

    # ── SPA Fallback (all other routes serve index.html) ─────────────────────
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header Referrer-Policy        "strict-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
