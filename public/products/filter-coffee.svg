<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="brassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#FDE047"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="coffeeFoam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#brassBg)"/>
  
  <!-- Steam -->
  <path d="M52 20 Q48 12 52 6" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M64 16 Q68 8 64 4" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Dabarah (Lower Brass Bowl) -->
  <path d="M28 66 L34 88 Q36 94 60 94 Q84 94 86 88 L92 66 Z" fill="url(#brassGold)"/>
  <ellipse cx="60" cy="66" rx="32" ry="7" fill="url(#brassGold)" stroke="#78350F" stroke-width="1.5"/>

  <!-- Tumbler (Brass Cup sitting in Dabarah) -->
  <path d="M42 32 L47 74 Q48 78 60 78 Q72 78 73 74 L78 32 Z" fill="url(#brassGold)" stroke="#78350F" stroke-width="1"/>
  
  <!-- Frothy Coffee head in tumbler -->
  <ellipse cx="60" cy="32" rx="18" ry="4.5" fill="url(#coffeeFoam)"/>
  <circle cx="56" cy="32" r="1.5" fill="#FEF08A"/>
  <circle cx="62" cy="31" r="1.2" fill="#FEF08A"/>
  <circle cx="65" cy="33" r="1" fill="#FEF08A"/>

  <!-- Badge Label -->
  <rect x="22" y="99" width="76" height="15" rx="7.5" fill="#92400E"/>
  <text x="60" y="110" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ஃபில்டர் காபி · FILTER</text>
</svg>
