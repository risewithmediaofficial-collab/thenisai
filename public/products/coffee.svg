<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="coffeeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <linearGradient id="coffeeFroth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#coffeeBg)"/>
  
  <!-- Steam -->
  <path d="M50 20 Q46 12 50 6" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M60 18 Q64 10 60 4" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M70 20 Q66 12 70 6" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Saucer -->
  <ellipse cx="60" cy="94" rx="42" ry="9" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="2"/>
  <ellipse cx="60" cy="92" rx="28" ry="5" fill="#F3F4F6"/>

  <!-- Cup Handle -->
  <path d="M78 46 C94 46 94 76 76 76" fill="none" stroke="#E5E7EB" stroke-width="7" stroke-linecap="round"/>

  <!-- Cup Body -->
  <path d="M36 38 L42 82 Q44 88 60 88 Q76 88 78 82 L84 38 Z" fill="url(#cupGrad)" stroke="#D1D5DB" stroke-width="2"/>

  <!-- Coffee Surface & Latte Swirl -->
  <ellipse cx="60" cy="38" rx="24" ry="7" fill="url(#coffeeFroth)"/>
  <path d="M52 38 Q60 42 68 37 Q60 35 52 38 Z" fill="#FDE68A" opacity="0.8"/>
  
  <!-- Badge Label -->
  <rect x="30" y="99" width="60" height="15" rx="7.5" fill="#78350F"/>
  <text x="60" y="110" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">காபி · COFFEE</text>
</svg>
