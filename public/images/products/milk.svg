      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="milkWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#milkBg)"/>
  
  <!-- Steam -->
