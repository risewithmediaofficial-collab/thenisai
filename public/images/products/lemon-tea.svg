<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="lemonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8"/>
      <stop offset="100%" stop-color="#FEF9C3"/>
    </linearGradient>
    <linearGradient id="lemonLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#lemonBg)"/>
  
  <!-- Steam -->
  <path d="M50 22 Q46 14 50 8" stroke="#EAB308" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M62 18 Q66 10 62 4" stroke="#CA8A04" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Glass Tumbler Outline -->
  <path d="M38 34 L45 92 Q47 98 60 98 Q73 98 75 92 L82 34 Z" fill="#FFFFFF" opacity="0.3" stroke="#FDE047" stroke-width="1.5"/>
  
  <!-- Golden Amber Lemon Tea -->
