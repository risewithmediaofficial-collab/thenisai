  <!-- Lemon Wheel on Rim -->
  <circle cx="75" cy="30" r="14" fill="#FACC15" stroke="#CA8A04" stroke-width="1.5"/>
  <circle cx="75" cy="30" r="10" fill="#FEF08A"/>
  <!-- Lemon segments -->
