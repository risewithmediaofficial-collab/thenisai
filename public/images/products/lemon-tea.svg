  <!-- Badge Label -->
  <rect x="18" y="99" width="84" height="15" rx="7.5" fill="#A16207"/>
  <text x="60" y="110" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">எலுமிச்சை டீ · LEMON TEA</text>
</svg>
