services:
  # ─────────────────────────────────────────
  # Frontend — React SPA served via Nginx
  # Nginx proxies /api/* → backend:5003
  # Accessible at http://YOUR_VPS_IP:92
  # ─────────────────────────────────────────
  thenisai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thenisai-frontend
    ports:
      - "92:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - thenisai-net

  # ─────────────────────────────────────────
  # Backend — Node.js Express API
  # Connects to MongoDB container
  # Accessible internally at backend:5003
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thenisai-backend
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/thenisai
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:5003/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - thenisai-net

  # ─────────────────────────────────────────
  # MongoDB — Persistent database
  # Data stored in named Docker volume
  # Connection: mongodb://mongodb:27017/thenisai
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: thenisai-mongodb
    volumes:
      - thenisai-mongodb:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - thenisai-net

# ─────────────────────────────────────────
# Named volumes — data survives container restarts
# ─────────────────────────────────────────
volumes:
  thenisai-mongodb:
    driver: local

# Internal bridge network — containers communicate by service name
networks:
  thenisai-net:
    driver: bridge
